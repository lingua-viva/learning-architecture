name: Auto Desktop Release

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "src/**"
      - "static/**"
      - "docs/index.html"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/auto-release.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  auto-release:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test gate
        run: pytest -q tests/

      - name: Health
        run: python3 -m src.lingua_viva.cli health

      - name: Backend smoke
        run: |
          python3 src/web.py 8787 > /tmp/lv-web.log 2>&1 &
          echo $! > /tmp/lv-web.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then break; fi
            sleep 1
            if [ $i -eq 30 ]; then cat /tmp/lv-web.log; exit 1; fi
          done
          # Canary: verify routers registered (sources, safeguarding, artifacts).
          # Without this gate, the lv.spec hiddenimports gap silently drops all
          # feature routes — the health endpoint passes but every /api/poi/*,
          # /api/sources/*, /api/safeguarding/* route 404s.
          ROUTERS=$(curl -fsS http://127.0.0.1:8787/api/health | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('routers_loaded',0), d.get('routers_expected',0))")
          LOADED=$(echo "$ROUTERS" | cut -d' ' -f1)
          EXPECTED=$(echo "$ROUTERS" | cut -d' ' -f2)
          if [ "$LOADED" != "$EXPECTED" ] || [ "$LOADED" = "0" ]; then
            echo "FAIL: routers_loaded=$LOADED routers_expected=$EXPECTED — feature routes are missing"
            cat /tmp/lv-web.log
            exit 1
          fi
          echo "Routers OK: $LOADED/$EXPECTED"
          kill "$(cat /tmp/lv-web.pid)" 2>/dev/null || true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compute next desktop tag
        id: tag
        run: |
          latest="$(git tag -l 'desktop-v*' --sort=-v:refname | head -1)"
          if [ -z "$latest" ]; then latest="desktop-v0.2.15"; fi
          version="${latest#desktop-v}"
          IFS=. read -r major minor patch <<EOF
          $version
          EOF
          patch=$((patch + 1))
          next="desktop-v${major}.${minor}.${patch}"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      # Pin-ordering fix (2026-08-10): the site pin used to happen HERE,
      # before any build ran — so a failed build (e.g. v0.2.49's hdiutil
      # flake) left the live download button pointing at a release that
      # did not exist (404) until someone intervened. The pin now lives in
      # the pin-site job below, which runs only after desktop-release
      # succeeds AND every asset answers 200. Until then the site keeps
      # serving the previous good release.

      # Class-3 fix (QA blast radius, 2026-08-02): desktop/package.json sat
      # frozen at an old version while tags advanced, so the app's About/
      # in-app version disagreed with the release it shipped in. Keep the
      # package version locked to the computed tag; desktop-release.yml
      # hard-gates on the match.
      - name: Sync desktop/package.json version to tag
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("desktop/package.json")
          version = os.environ["NEXT_TAG"].removeprefix("desktop-v")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"] = version
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
        env:
          NEXT_TAG: ${{ steps.tag.outputs.tag }}

      # The package.json sync must be IN the tagged commit (desktop-release's
      # version-match gate checks it), so it commits before tagging. The
      # docs/index.html pin deliberately does NOT — see pin-site below.
      - name: Commit desktop version sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet desktop/package.json; then
            git add desktop/package.json
            git commit -m "chore(release): prepare ${{ steps.tag.outputs.tag }}"
            git push origin main
          fi

      - name: Create release tag
        # GAP CLOSED (2026-08-09, first found 2026-07-29): this push uses the
        # default GITHUB_TOKEN, and GitHub deliberately does NOT fire other
        # workflows (incl. desktop-release.yml's `push: tags:` trigger) for
        # GITHUB_TOKEN pushes, to prevent recursive workflow chains — so
        # desktop-v0.2.46 and v0.2.47 both needed manual tag re-pushes to
        # build. Fix: the desktop-release job below invokes
        # desktop-release.yml directly via `workflow_call` with this tag, so
        # the build no longer depends on the tag push firing anything. The
        # tag itself is still pushed here first — the called workflow checks
        # out `inputs.tag`, which must exist on origin.
        run: |
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

  desktop-release:
    needs: auto-release
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag: ${{ needs.auto-release.outputs.tag }}
    secrets: inherit

  # Pin-ordering fix (2026-08-10): the live site only advances to the new
  # tag after the release exists AND every asset is provably downloadable
  # (Rule 0: pushed = downloadable, nothing else counts). A failed build
  # leaves the site on the previous good release instead of a 404.
  pin-site:
    needs: [auto-release, desktop-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify every release asset answers 200
        run: |
          tag="${{ needs.auto-release.outputs.tag }}"
          for asset in LinguaViva.dmg LinguaViva-Setup.exe LinguaViva.AppImage LinguaViva.deb; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L \
              "https://github.com/${{ github.repository }}/releases/download/$tag/$asset")
            if [ "$code" != "200" ]; then
              echo "::error::$asset for $tag returned HTTP $code — refusing to pin the site to a release that is not fully downloadable"
              exit 1
            fi
            echo "✓ $asset: 200"
          done

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pin live site to released tag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          path = Path("docs/index.html")
          tag = os.environ["NEXT_TAG"]
          text = path.read_text(encoding="utf-8")
          text = re.sub(r"desktop-v[0-9]+\.[0-9]+\.[0-9]+", tag, text)
          path.write_text(text, encoding="utf-8")
          PY
        env:
          NEXT_TAG: ${{ needs.auto-release.outputs.tag }}

      - name: Commit and push site pin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet docs/index.html; then
            echo "site already pinned to ${{ needs.auto-release.outputs.tag }}"
            exit 0
          fi
          git add docs/index.html
          git commit -m "chore(release): pin ${{ needs.auto-release.outputs.tag }}"
          # main may have advanced while the builds ran — rebase the one-line
          # pin commit rather than failing non-fast-forward.
          for attempt in 1 2 3; do
            if git push origin main; then exit 0; fi
            git pull --rebase origin main
          done
          git push origin main
