name: Auto Desktop Release

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "src/**"
      - "static/**"
      - "docs/index.html"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/auto-release.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  auto-release:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test gate
        run: pytest -q tests/

      - name: Health
        run: python3 -m src.lingua_viva.cli health

      - name: Backend smoke
        run: |
          python3 src/web.py 8787 > /tmp/lv-web.log 2>&1 &
          echo $! > /tmp/lv-web.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lv-web.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compute next desktop tag
        id: tag
        run: |
          latest="$(git tag -l 'desktop-v*' --sort=-v:refname | head -1)"
          if [ -z "$latest" ]; then latest="desktop-v0.2.15"; fi
          version="${latest#desktop-v}"
          IFS=. read -r major minor patch <<EOF
          $version
          EOF
          patch=$((patch + 1))
          next="desktop-v${major}.${minor}.${patch}"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Pin live site to new tag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          path = Path("docs/index.html")
          tag = os.environ["NEXT_TAG"]
          text = path.read_text(encoding="utf-8")
          text = re.sub(r"desktop-v[0-9]+\.[0-9]+\.[0-9]+", tag, text)
          path.write_text(text, encoding="utf-8")
          PY
        env:
          NEXT_TAG: ${{ steps.tag.outputs.tag }}

      # Class-3 fix (QA blast radius, 2026-08-02): desktop/package.json sat
      # frozen at an old version while tags advanced, so the app's About/
      # in-app version disagreed with the release it shipped in. Keep the
      # package version locked to the computed tag; desktop-release.yml
      # hard-gates on the match.
      - name: Sync desktop/package.json version to tag
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("desktop/package.json")
          version = os.environ["NEXT_TAG"].removeprefix("desktop-v")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"] = version
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
        env:
          NEXT_TAG: ${{ steps.tag.outputs.tag }}

      - name: Commit site pin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet docs/index.html desktop/package.json; then
            git add docs/index.html desktop/package.json
            git commit -m "chore(release): pin ${{ steps.tag.outputs.tag }}"
            git push origin main
          fi

      - name: Create release tag
        # KNOWN GAP (found 2026-07-29): this push uses the default
        # GITHUB_TOKEN via actions/checkout's persisted credentials. GitHub
        # deliberately does NOT fire other workflows (incl. this repo's
        # desktop-release.yml, which triggers on `push: tags: ['desktop-v*']`)
        # for pushes authored by GITHUB_TOKEN, to prevent recursive workflow
        # chains. Net effect: this step creates the tag, but desktop-release.yml
        # never runs from it -- confirmed by a real failed run that sat with
        # zero triggered builds. Until a PAT-backed secret (repo+workflow
        # scope) replaces GITHUB_TOKEN here, or desktop-release.yml is
        # restructured as a `workflow_call` invoked directly from this job,
        # every tag this step creates needs a manual re-push (delete + push
        # again with non-Actions credentials) to actually build.
        run: |
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"
