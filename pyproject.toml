[project]
name = "lingua-viva"
version = "1.0.7"
description = "Local-first Lingua Viva teacher support app."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Mical Neill"}]

dependencies = [
    "pyyaml>=6.0",
    "redis>=5.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "websockets>=12.0",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "sqlite-vec>=0.1.9",
    "faster-whisper>=1.1.1",
    "python-multipart>=0.0.9",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "jsonschema>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
